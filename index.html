<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>תכנון הרכב של אסף</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@700&display=swap">
<style>
  :root{--ground:#F4EDDD;--surface:#FDFAF3;--surface-2:#F8F2E4;--ink:#2B2417;--muted:#7A6D58;--rule:#E3D8C2;--rule-strong:#CDBFA3;--blue:#2A62A3;--red:#B93A31;--red-soft:#F4DDD9;color-scheme:light}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#221C13;--surface:#2A2319;--surface-2:#322A1E;--ink:#EFE6D4;--muted:#A89A82;--rule:#3E3527;--rule-strong:#57493A;--blue:#5490D6;--red:#D9655A;--red-soft:#4E2A26;color-scheme:dark}}
  :root[data-theme="dark"]{--ground:#221C13;--surface:#2A2319;--surface-2:#322A1E;--ink:#EFE6D4;--muted:#A89A82;--rule:#3E3527;--rule-strong:#57493A;--blue:#5490D6;--red:#D9655A;--red-soft:#4E2A26;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ground);color:var(--ink);font-family:"Heebo","Arial Hebrew",Arial,sans-serif;font-size:15px;line-height:1.5;direction:rtl}
  .box{width:min(380px,92vw);background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:28px 26px 24px}
  .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted)}
  h1{font-family:"Frank Ruhl Libre","Times New Roman",serif;font-size:26px;line-height:1.2;margin:4px 0 18px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--rule-strong);border-radius:6px;background:var(--surface-2);color:var(--ink);direction:ltr;text-align:left}
  input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  button{margin-top:18px;width:100%;font:inherit;font-weight:500;padding:10px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--ground);cursor:pointer}
  button[disabled]{opacity:.6;cursor:wait}
  .err{margin-top:12px;padding:8px 12px;border-radius:6px;background:var(--red-soft);color:var(--ink);font-size:14px}
  .err[hidden]{display:none}
  .note{margin-top:14px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="eyebrow">אסף יוסיפוב · תכנון פיננסי 2027–2037</div>
  <h1>תכנון הרכב של אסף</h1>
  <label for="u">שם משתמש</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
  <label for="p">סיסמה</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit" id="go">כניסה</button>
  <div class="err" id="err" hidden>שם המשתמש או הסיסמה שגויים. נסו שוב.</div>
  <div class="note">הדף מוצפן. בלי הפרטים הנכונים אין גישה לתוכן.</div>
</form>
